<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shopping Cart</title>
    <link rel = "stylesheet" href="style.css">
</head>
<body>
    <div class ="header">
        <div class="logo">
            Online Shopping
        </div>

        <div class="nav">
            <a href="index.html">Home</a>
            <a href="Pages/Customer/cart.html">Cart</a>
            <a href="Pages/login-option.html">Login</a>
        </div>
    </div>

    <div class="main">
        <h1>Welcome to Online Shopping Cart</h1>
        <p>Find the products you need at the best prices!!!.</p>
        <a href="Pages/Customer/fashion.html" class="shop-now">Shop Now</a>

    <br>
    <div class="category-section">
        <h2>Shop By Category</h2>
    <br>
        <div class="category-container">
            <div class="category-card">

           <h3>Electronics</h3>

                <p>Explore Clothing Products</p>
                </a>
            </div>

            <div class="category-card">
                <a href="Pages/Customer/home.html?category=home"
                class="home-page">
                <img src="Images/logo/home appliances.png" width="400">

                </h3>
                <p>Explore accessories</p>

</div>
<div class="footer">
