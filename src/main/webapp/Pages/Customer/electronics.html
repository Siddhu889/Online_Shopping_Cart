<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <link rel="stylesheet" href="electronics.css">
</head>
<body>

    <div class="header">
        <div class="header-content">
            <h1 class="website-title">Online Shopping Cart</h1>
            <p class="website-subtitle">Find the products you need</p>
        </div>
    </div>
    <div class="search-section">
        <form class="search-form">
            <input
                type="text"
                class="search-input"
                placeholder="Search for products..."
            >
        </form>
    </div>
    <div class="products">
        <!-- Products are created by JavaScript -->
    </div>
    <div class="footer">
        <p class="footer-text">@ 2026 Online Shopping Cart</p>
    </div>
    <script src="product.js"></script>
    <script src="electronics.js"></script>
</body>
</html>
