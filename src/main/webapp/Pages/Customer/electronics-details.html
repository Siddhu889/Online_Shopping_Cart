<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details</title>
    <link rel="stylesheet" href="electronics-details.css">
</head>
<body>
    <div class="container">
        <div class="product-image">
            <img src="" class="product-img">
        </div>
        <div class="product-info">

            <h1 class="product-name"></h1>
            <p class="price"></p>
            <p class="description"></p>
        <h2>Key Features</h2>

            <ul class="features">
                <!-- Features are added by JavaScript -->
            </ul>
                   <p>
                <strong>Availability:</strong>
                <span class="available"></span>
            </p>

            <p class="category"></p>
            <label for="quantity">Quantity:</label>
            <input
                type="number"
                id="quantity"
                value="1"
                min="1"
            >
            <br><br>
            <button class="cart-button">
                Add to Cart
            </button>

            <br><br>
            <a href="electronics.html" class="back-link">
            Back to page
            </a>
        </div>

    </div>
    <div class="footer">
        <p>
            &copy; 2024 Online Shopping Cart. All rights reserved.
        </p>
    </div>
     <script src="product.js"></script>
    <script src="electronics-details.js"></script>
</body>
</html>
