<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <link rel="stylesheet" href="cart.css">
</head>
<body>
    <header class="header">
        <h1>Online Shopping Cart</h1>
    <nav>
        <a href="../../index.html">Home</a>
        <a href="cart.html">Cart</a>
    </nav>
    </header>

    <main>
        <h1 class="cart-title">My Shopping Cart</h1>
        <div class="cart-container">
            <div class="cart-items">

            </div>

            <div class="cart-summary">
                <h2>Cart Summary</h2>

                <p>Total Items: <span class="total-items">0</span></p>
                <p>Total Amount:₹<span class="total-amount">0</span></p>
                <a href="../../index.html" class="continue-button">
                    Continue Shopping
                </a>

                <a href="checkout.html" class="checkout-button">
                    Proceed to Checkout

                </a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Online Shopping Cart.</p>
    </footer>

    <script src="cart.js"></script>
</body>
</html>
